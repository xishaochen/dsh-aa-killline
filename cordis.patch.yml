# dsh-aa-killline 的 bundle patch 层。
#
# `dsh plugin add dsh-aa-killline`（npm 或 github:）读本文件，把这条 loader entry
# 插进 profile 树。插件市场只收声明了 `dsh.bundle` 且带本文件的包。
#
# 两条硬规则：
#   · `name` 必须与 package.json 的 `name` 完全一致，写成别的会在开机解析时失败；
#   · `id` 是 Cordis 插件 id（= lib/index.js 的 `export const name`）。
#
# 本插件没有需要覆写的配置：技能正文由 SKILL.md 提供，数据链路的可选凭证
# 通过环境变量或包内 config/*.env 提供，主机相关的值不进这里。
- insert:
    - id: aa-killline
      name: 'dsh-aa-killline'
